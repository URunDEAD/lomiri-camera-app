clickable_minimum_required: '8.0.0'

builder: cmake

framework: ubuntu-sdk-20.04
build_args: "-DCLICK_MODE=ON -DCLICK_VERSION=$(git describe --tags --dirty|sed -e 's/^v//')"

ignore_review_errors: true

dependencies_target:
- libqt5svg5-dev
- qtquickcontrols2-5-dev
- libexiv2-dev
- libqzxing-dev

# Bundle libexiv2.so.27 into the click, because the app is built in the
# focal (20.04) framework container (exiv2 0.27), while the UT 24.04 base
# image only ships libexiv2.so.28. Without this, the app fails to start with
# "libexiv2.so.27: cannot open shared object file: No such file or directory".
install_lib:
- /usr/lib/${ARCH_TRIPLET}/libexiv2.so.0*
- /usr/lib/${ARCH_TRIPLET}/libexiv2.so.27*

